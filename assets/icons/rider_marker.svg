<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo exterior con efecto de glow -->
  <circle cx="50" cy="50" r="45" fill="#00D9FF" opacity="0.2"/>
  <circle cx="50" cy="50" r="35" fill="#00D9FF" opacity="0.4"/>

  <!-- Círculo principal -->
  <circle cx="50" cy="50" r="25" fill="#0066FF"/>

  <!-- Ícono de bicicleta simplificado -->
  <g transform="translate(50, 50)">
    <!-- Rueda trasera -->
    <circle cx="-10" cy="8" r="6" fill="white" stroke="white" stroke-width="1.5"/>

    <!-- Rueda delantera -->
    <circle cx="10" cy="8" r="6" fill="white" stroke="white" stroke-width="1.5"/>

    <!-- Marco de la bici -->
    <path d="M -10 8 L 0 -5 L 10 8" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 0 -5 L 5 -2" stroke="white" stroke-width="2" stroke-linecap="round"/>

    <!-- Manubrio -->
    <line x1="5" y1="-2" x2="8" y2="-5" stroke="white" stroke-width="2" stroke-linecap="round"/>

    <!-- Asiento -->
    <line x1="-3" y1="-2" x2="-6" y2="-5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
